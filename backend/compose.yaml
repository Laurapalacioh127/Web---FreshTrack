name: web-freshtrack

services:
  postgres:
    image: postgres:17-alpine
    container_name: web-freshtrack-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: freshtrack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - freshtrack_data:/var/lib/postgresql/data

volumes:
  freshtrack_data:
